  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

  <!-- ESCENA PRINCIPAL (fondo de gatitos) -->
  <main id="scene" aria-live="polite">
    <div id="floaters" aria-hidden="true"></div>

    <!-- Nota rosa (post-it) con la cuenta regresiva -->
    <section id="note" class="note" hidden>
      <span class="tape" aria-hidden="true"></span>
      <p class="note-top">Faltan</p>
      <div class="count" role="timer" aria-label="Tiempo que falta para el cumpleaños de Annie">
        <div class="unit"><b id="d">00</b><small id="dl">días</small></div>
        <div class="unit"><b id="h">00</b><small id="hl">horas</small></div>
        <div class="unit"><b id="m">00</b><small id="ml">minutos</small></div>
        <div class="unit"><b id="s">00</b><small id="sl">segundos</small></div>
      </div>
      <p class="note-bottom">para el cumpleaños de <span class="name">Annie</span> 🎂</p>
      <p class="note-date" id="ndate">♡ 28 de octubre ♡</p>
    </section>

    <!-- Cartulina de feliz cumpleaños -->
    <section id="card" class="card" hidden>
      <svg class="bunting" viewBox="0 0 400 70" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 6 Q200 56 400 6" fill="none" stroke="#222" stroke-width="2"/>
        <g id="flags"></g>
      </svg>
      <div class="cartulina">
        <img class="deco d1" src="img/cat3.png" alt="">
        <img class="deco d2" src="img/cat7.png" alt="">
        <img class="deco d3" src="img/paw1.png" alt="">
        <img class="deco d4" src="img/yarn.png" alt="">
        <h1>
          <span class="l1">¡Feliz</span>
          <span class="l2">cumpleaños,</span>
          <span class="l3">Annie!</span>
        </h1>
        <p class="cake">🎂 🎉 🎁</p>
      </div>
    </section>

    <div id="confetti" aria-hidden="true"></div>
  </main>

  <!-- PUERTA NEGRA CON EL REGALO -->
  <div id="intro">
    <button id="gift" type="button" aria-label="Abrir el regalo">
      <span class="spark s1">✦</span>
      <span class="spark s2">✦</span>
      <span class="spark s3">✦</span>
      <span class="spark s4">✧</span>
      <div class="gift-wrap">
        <div class="box">
          <div class="rib-v"></div>
        </div>
        <div class="lid">
          <div class="rib-v"></div>
          <div class="bow">
            <span class="tail tl"></span>
            <span class="tail tr"></span>
            <span class="loop ll"></span>
            <span class="loop lr"></span>
            <span class="knot"></span>
          </div>
        </div>
      </div>
    </button>
    <p class="hint">toca el regalo</p>
    <div class="flash"></div>
    <div id="burst" aria-hidden="true"></div>
  </div>

  <!-- Capa de efectos de clic (por encima de todo) -->
  <div id="fx" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
